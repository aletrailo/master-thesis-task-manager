<div class="d-flex flex-column flex-lg-row align-items-lg-end gap-3 mb-4">
  <div class="flex-grow-1">
    <label for="pretraga" class="form-label small fw-semibold">
      Pretraga
    </label>

    <input
      id="pretraga"
      type="search"
      class="form-control"
      placeholder="Pretraži zadatke..."
      [value]="pretraga()"
      (input)="promeniPretragu($event)"
    >
  </div>

  <div>
    <label for="status" class="form-label small fw-semibold">Status</label>
    <select
      id="status"
      class="form-select"
      [value]="status()"
      (change)="promeniStatus($event)"
    >
      <option value="svi">Svi zadaci</option>
      <option value="aktivan">Aktivni</option>
      <option value="zavrsen">Završeni</option>
    </select>
  </div>

  <div>
    <label for="sortiranje" class="form-label small fw-semibold">Sortiranje</label>
    <select
      id="sortiranje"
      class="form-select"
      [value]="sortiranje()"
      (change)="promeniSortiranje($event)"
    >
      <option value="naziv-asc">Naziv A–Z</option>
      <option value="naziv-desc">Naziv Z–A</option>
    </select>
  </div>
</div>
