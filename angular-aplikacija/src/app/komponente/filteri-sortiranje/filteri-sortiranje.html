<div class="d-flex flex-column flex-lg-row align-items-lg-end gap-3 mb-4">
  <div class="pretraga w-100 me-lg-auto">
    <label for="pretraga" class="form-label small fw-semibold">Pretraga</label>
    <input
      id="pretraga"
      type="search"
      class="form-control"
      placeholder="Pretraži zadatke..."
      [value]="pretraga()"
      (input)="promeniPretragu($event)"
    >
  </div>

  <div>
    <span class="form-label small fw-semibold d-block">Status</span>
    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-sm rounded-pill px-3"
        [class.btn-warning]="aktivniUkljuceni()"
        [class.btn-outline-secondary]="!aktivniUkljuceni()"
        [attr.aria-pressed]="aktivniUkljuceni()"
        (click)="aktivniPromenjeni.emit(!aktivniUkljuceni())"
      >
        Aktivni
      </button>

      <button
        type="button"
        class="btn btn-sm rounded-pill px-3"
        [class.btn-success]="zavrseniUkljuceni()"
        [class.btn-outline-secondary]="!zavrseniUkljuceni()"
        [attr.aria-pressed]="zavrseniUkljuceni()"
        (click)="zavrseniPromenjeni.emit(!zavrseniUkljuceni())"
      >
        Završeni
      </button>
    </div>
  </div>

  <div>
    <label for="sortiranje" class="form-label small fw-semibold">Sortiranje</label>
    <select
      id="sortiranje"
      class="form-select"
      [value]="sortiranje()"
      (change)="promeniSortiranje($event)"
    >
      <option value="naziv-asc">Naziv A–Z</option>
      <option value="naziv-desc">Naziv Z–A</option>
    </select>
  </div>
</div>
