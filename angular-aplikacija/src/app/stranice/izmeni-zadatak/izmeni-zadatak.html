<div class="container py-5">
  <div class="mx-auto" style="max-width: 700px;">
    @if (zadatak) {
      <app-zadatak-forma
        naslov="Izmeni zadatak"
        [pocetniPodaci]="zadatak"
        (sacuvano)="izmeni($event)"
      />
    } @else {
      <div class="alert alert-warning">
        Zadatak nije pronađen.
      </div>
    }
  </div>
</div>
