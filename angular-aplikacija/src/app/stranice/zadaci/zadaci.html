<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Zadaci</h1>

    <a routerLink="/zadaci/novi" class="btn btn-primary">
      Dodaj zadatak
    </a>
  </div>

  <div class="row g-4">
    @for (zadatak of zadaci(); track zadatak.id) {
      <div class="col-12 col-md-6">
        <app-zadatak-kartica [zadatak]="zadatak" />
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-info mb-0">
          Nema zadataka.
        </div>
      </div>
    }
  </div>
</div>
